[project]
name = "{{PKG}}"
version = "0.1.0"
description = "{{NUMBER}}-{{SLUG}} — scaffold; preregister in experiments/ before writing measurement code."
requires-python = ">=3.11"
dependencies = [
    "torch>=2.5",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
{{SLUG}} = "{{PKG}}.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/{{PKG}}"]

# ── accelerator wheels ────────────────────────────────────────────────────────
# Default: CUDA 12.6 on Windows and Linux. PyPI's default torch wheel on Windows is
# CPU-only and fails silently by being 50x slower, so the index is pinned explicitly.
#
# Override for other backends (no file edit needed):
#   AMD/ROCm (Linux):  uv sync --index pytorch=https://download.pytorch.org/whl/rocm6.2
#   CPU only:          uv sync --index pytorch=https://download.pytorch.org/whl/cpu
#
# Always verify what you actually got:  uv run {{SLUG}} doctor
[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch" }]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH"]

[tool.ruff.lint.per-file-ignores]
# device.py is the ONE place allowed to name a vendor backend.
"src/{{PKG}}/device.py" = ["PTH"]
# B008 flags typer.Option() in argument defaults — that IS the typer idiom, not a bug.
"src/{{PKG}}/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
