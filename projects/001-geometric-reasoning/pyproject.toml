[project]
name = "geomreason"
version = "0.1.0"
description = "Is reasoning a property of internal geometry rather than scale? A falsification harness."
requires-python = ">=3.11"
dependencies = [
    "torch==2.14.1",
    "transformers>=4.44",
    "numpy>=1.26",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
geom = "geomreason.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geomreason"]

# ── accelerator wheels ────────────────────────────────────────────────────────
# Default: CUDA 12.6 on Windows and Linux. PyPI's default torch wheel on Windows is
# CPU-only and fails silently by being 50x slower, so the index is pinned explicitly.
# [source] The current environment pins torch==2.14.1 (dependency above); historical
# runs recorded torch 2.13.0+cu126 (results/*.json, hardware.accelerator.torch_version).
# The pin constrains uv sync, but Dependabot can update it in a subsequent PR.
# See notes/env-lock-vs-run-records.md for the historical environment investigation.
#
# Override for other backends (no file edit needed):
#   AMD/ROCm (Linux):  uv sync --index pytorch=https://download.pytorch.org/whl/rocm6.2
#   CPU only:          uv sync --index pytorch=https://download.pytorch.org/whl/cpu
#
# Always verify what you actually got:  uv run geom doctor
[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch" }]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH"]

[tool.ruff.lint.per-file-ignores]
# device.py is the ONE place allowed to name a vendor backend.
"src/geomreason/device.py" = ["PTH"]
# B008 flags typer.Option() in argument defaults — that IS the typer idiom, not a bug.
"src/geomreason/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
